<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpectreWare</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  h1 {
    font-size: 3rem;
    background: linear-gradient(90deg, #7f5af0, #2cb67d);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 10px;
  }
  p { color: #a0a0b0; margin-bottom: 30px; font-size: 1.1rem; }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 30px 40px;
    backdrop-filter: blur(10px);
  }
  .btn {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 28px;
    background: #7f5af0;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    transition: 0.3s;
  }
  .btn:hover { background: #6c47e0; }
  footer {
    margin-top: 40px;
    font-size: 0.85rem;
    color: #666;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>SpectreWare</h1>
    <p>เว็บไซต์ทดลอง — ทำงานได้ผ่าน GitHub Pages 🚀</p>
    <a href="#" class="btn">Get Started</a>
  </div>
  <footer>© 2026 SpectreWareZ</footer>
</body>
</html>
